# Test config for reverse_homing
[stepper_x]
step_pin: PF0
dir_pin: PF1
enable_pin: !PD7
microsteps: 16
rotation_distance: 40
endstop_pin: ^PE5
position_endstop: 0
position_max: 200
homing_speed: 50

[stepper_y]
step_pin: PF6
dir_pin: !PF7
enable_pin: !PF2
microsteps: 16
rotation_distance: 40
endstop_pin: ^PJ1
position_endstop: 0
position_max: 200
homing_speed: 50

[stepper_z]
step_pin: PL3
dir_pin: PL1
enable_pin: !PK0
microsteps: 16
rotation_distance: 8
endstop_pin: ^PD3
position_endstop: 0.5
position_max: 200

[tmc2209 stepper_z]
uart_pin: PA5
diag_pin: PH6
run_current: .5
sense_resistor: 0.110

[stepper_z1]
step_pin: PC1
dir_pin: PC3
enable_pin: !PC7
microsteps: 16
rotation_distance: 8

[tmc2209 stepper_z1]
uart_pin: PK5
diag_pin: PH5
run_current: .5
sense_resistor: 0.110

[reverse_homing]
steppers: stepper_z, stepper_z1
endstop_pins: tmc2209_stepper_z:virtual_endstop,
    tmc2209_stepper_z1:virtual_endstop
speed: 8

[force_move]
enable_force_move: True

[mcu]
serial: /dev/ttyACM0

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100
